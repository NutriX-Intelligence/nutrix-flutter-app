name: nutrix_app
description: "NutriX AI Diet Planner Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # Routing
  go_router: ^14.8.1

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Barcode scanner
  # Image picker (for OCR)
  image_picker: ^1.1.2

  # Animations
  flutter_animate: ^4.5.2

  # Utils
  intl: ^0.20.2
  percent_indicator: ^4.2.3
  permission_handler: ^12.0.3
  simple_barcode_scanner: ^0.6.0
  google_sign_in: ^7.2.0
  local_auth: ^3.0.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0

  # Home screen widgets
  home_widget: ^0.7.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
